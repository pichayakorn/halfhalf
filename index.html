<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HalfHalf</title>
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Theme initialization (prevents theme flash)
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryTheme = urlParams.get('theme');
      const savedTheme = localStorage.getItem('halfhalf_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (queryTheme === 'dark' || (queryTheme !== 'light' && (savedTheme === 'dark' || (!savedTheme && prefersDark)))) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Favicon / App Icon -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HalfHalf">
  <link rel="apple-touch-icon" href="icon-solid.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" /><path d="m12 9 6 6" /><path d="m18 9-6 6" /></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></symbol>
    <symbol id="i-trash-2" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
    <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></symbol>
  </svg>



  <div class="app-container">
    <div class="header">
      <div class="header-top">
        <h1>HalfHalf</h1>
        <div style="display: flex; gap: 8px;">
          <button class="theme-toggle-btn" id="theme-toggle-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon theme-icon-light" style="width: 16px; height: 16px;" aria-hidden="true"><use href="#i-sun"/></svg>
            <svg class="icon theme-icon-dark" style="width: 16px; height: 16px;" aria-hidden="true"><use href="#i-moon"/></svg>
          </button>
          <button class="hamburger-btn" id="drawer-open-btn" type="button" title="Saved splits" aria-label="Open saved splits" aria-controls="history-drawer">
            <svg class="icon" style="width: 16px; height: 16px;" aria-hidden="true"><use href="#i-menu"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Subsidy Tracker -->
    <div class="balance-box">
      <div class="bal-left">
        <span class="bal-title">Available Subsidy</span>
        <div class="bal-val-wrapper">
          <span class="bal-currency">฿</span>
          <input type="text" id="remaining-subsidy-input" class="bal-val-input" aria-label="Available subsidy" value="200.00" inputmode="none">
        </div>
      </div>
      <div class="bal-limit">
        Optimal Limit<br>
        <span>Max: <span id="optimal-limit-val">฿333.33</span></span>
      </div>
    </div>

    <!-- Input Box -->
    <div class="input-section">
      <div class="input-container">
        <label class="input-label" for="original-price">Amount to Split (60/40 Ratio)</label>
        <div class="price-input-wrapper">
          <span class="currency-symbol">฿</span>
          <input type="text" id="original-price" class="price-input" placeholder="0.00" autofocus inputmode="none">
        </div>
      </div>
    </div>

    <!-- Visual Divider -->
    <div class="visual-split">
      <div class="split-gov" id="gov-bar-segment" style="width: 60%"></div>
      <div class="split-user" id="user-bar-segment" style="width: 40%"></div>
    </div>

    <!-- Calculated Split Boxes -->
    <div class="results-grid">
      <div class="result-box gov">
        <div class="result-label">Gov Support (60%)</div>
        <div class="result-val-wrapper gov" id="gov-val-wrapper">
          <span>฿</span>
          <input type="text" id="val-gov" class="result-input gov" aria-label="Government support amount" placeholder="0.00" inputmode="none">
        </div>
      </div>
      <div class="result-box user">
        <div class="result-label">Your Share (40%)</div>
        <div class="result-val-wrapper user" id="user-val-wrapper">
          <span>฿</span>
          <input type="text" id="val-user" class="result-input user" aria-label="Your share amount" placeholder="0.00" inputmode="none">
        </div>
      </div>
      <div class="cap-alert" id="cap-alert" role="status" style="display: none;">
        * Government cap reached! You pay the rest on top.
      </div>
    </div>

    <!-- Embedded Numpad -->
    <div class="numpad">
      <button class="numpad-btn" type="button" data-val="1">1</button>
      <button class="numpad-btn" type="button" data-val="2">2</button>
      <button class="numpad-btn" type="button" data-val="3">3</button>
      <button class="numpad-btn" type="button" data-val="4">4</button>
      <button class="numpad-btn" type="button" data-val="5">5</button>
      <button class="numpad-btn" type="button" data-val="6">6</button>
      <button class="numpad-btn" type="button" data-val="7">7</button>
      <button class="numpad-btn" type="button" data-val="8">8</button>
      <button class="numpad-btn" type="button" data-val="9">9</button>
      <button class="numpad-btn" type="button" data-val=".">.</button>
      <button class="numpad-btn" type="button" data-val="0">0</button>
      <button class="numpad-btn delete-btn" type="button" data-val="backspace" aria-label="Backspace">
        <svg class="icon" style="width: 18px; height: 18px;" aria-hidden="true"><use href="#i-delete"/></svg>
      </button>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" type="button" onclick="saveCalculation()">
        <svg class="icon" style="width: 14px; height: 14px;" aria-hidden="true"><use href="#i-plus"/></svg>
        Record Split
      </button>
      <button class="btn btn-secondary" type="button" onclick="resetCalculator()">
        Reset
      </button>
    </div>



    <!-- History Drawer (Slides in from the right) -->
    <div class="history-drawer" id="history-drawer" role="dialog" aria-label="Saved splits" inert>
      <div class="drawer-header">
        <span class="drawer-title">
          <svg class="icon" style="width: 16px; height: 16px; color: var(--gov-color)" aria-hidden="true"><use href="#i-history"/></svg>
          Menu & Calculations
        </span>
        <button class="drawer-close-btn" id="drawer-close-btn" type="button" title="Close" aria-label="Close saved splits">
          <svg class="icon" style="width: 16px; height: 16px;" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>



      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Logs Archive</span>
        <div class="history-actions" id="history-actions-bar" style="display: none; gap: 6px;">
          <button class="action-icon-btn" type="button" title="Export CSV" aria-label="Export CSV" onclick="exportToCSV()">
            <svg class="icon" style="width: 14px; height: 14px;" aria-hidden="true"><use href="#i-download"/></svg>
          </button>
          <button class="action-icon-btn" type="button" title="Clear all" aria-label="Clear all records" onclick="clearAllLogs()">
            <svg class="icon" style="width: 14px; height: 14px;" aria-hidden="true"><use href="#i-trash-2"/></svg>
          </button>
        </div>
      </div>

      <div class="search-container" id="search-bar-wrapper" style="display: none; margin-bottom: 12px;">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="text" id="search-input" class="search-input" aria-label="Search calculations" placeholder="Search calculations..." oninput="renderHistory()">
      </div>

      <div class="log-list" id="history-list">
        <div class="empty-state">
          No records yet. Enter a value and save it.
        </div>
      </div>

      <!-- Footer / Credits -->
      <div class="app-footer" style="text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-top: auto; padding-top: 12px; border-top: 1px solid var(--card-border);">
        Made by <a href="https://github.com/pichayakorn" target="_blank" rel="noopener noreferrer" style="color: var(--text-main); text-decoration: none; font-weight: 500;">pichayakorn</a>
      </div>
    </div>
  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
